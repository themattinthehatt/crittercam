name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

# To cancel a currently running workflow from the same PR, branch or tag when a new workflow is triggered
# https://stackoverflow.com/a/72408109
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        id: ruff
        run: ruff check crittercam tests

      - name: Show fix instructions if linting failed
        if: always() && steps.ruff.outcome == 'failure'
        run: |
          echo ""
          echo "Linting failed!"
          echo ""
          echo "To auto-fix issues locally, run:"
          echo "  ruff check --fix crittercam tests"
          echo ""
          echo "To see all violations without fixing, run:"
          echo "  ruff check crittercam tests"
          echo ""
